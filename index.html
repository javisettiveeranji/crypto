<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoPulse | Mobile-Responsive Tracker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
            --nav-height: 70px;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #0284c7;
            --border: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            transition: background 0.3s ease;
            line-height: 1.5;
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 1rem; 
        }

        /* --- NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            height: var(--nav-height);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {  font-size: 1.25rem; font-weight: 700; 
            
        }
        .logo span { color: var(--accent); }

        .nav-actions { display: flex; gap: 10px; align-items: center; }

        #searchInput {
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            width: 140px; /* Smaller for mobile */
            transition: width 0.3s ease;
        }
        #searchInput:focus { width: 180px; border-color: var(--accent); }

        #themeToggle {
            background: none;
            border: 1px solid var(--border);
            padding: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 1.2rem;
        }

        /* --- CHART SECTION --- */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .chart-container { height: 350px; } /* Set height for chart */

        .chart-header { 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
            margin-bottom: 1rem; 
        }

        .selected-coin-info { display: flex; align-items: center; gap: 10px; }
        .selected-coin-info img { width: 32px; height: 32px; }
        .selected-coin-info h2 { font-size: 1.1rem; }

        .time-filters { display: flex; gap: 5px; }
        .time-filters button {
            flex: 1;
            padding: 0.4rem;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 6px;
        }
        .time-filters button.active { 
            background: var(--accent); 
            color: white; 
            border-color: var(--accent); 
        }

        /* --- GRID & CARDS --- */
        .crypto-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile: 1 column */
            gap: 1rem;
        }

        .coin-card {
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .coin-info { display: flex; align-items: center; gap: 0.75rem; }
        .coin-info img { width: 32px; height: 32px; }
        .coin-info h3 { font-size: 1rem; }
        
        .price-details { text-align: right; }
        .price { font-weight: 700; font-size: 0.95rem; }
        .change { font-size: 0.85rem; font-weight: 600; }
        .up { color: var(--success); }
        .down { color: var(--danger); }

        /* --- UTILS --- */
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
        .error-msg { color: var(--danger); text-align: center; padding: 1rem; }

        /* --- DESKTOP BREAKPOINTS --- */
        @media (min-width: 768px) {
            .container { padding: 2rem; }
            .chart-header { flex-direction: row; justify-content: space-between; }
            .crypto-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
            #searchInput { width: 250px; }
            #searchInput:focus { width: 300px; }
            .coin-card { flex-direction: column; align-items: flex-start; }
            .price-details { text-align: left; margin-top: 1rem; width: 100%; display: flex; justify-content: space-between; }
            .selected-coin-info h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Crypto<span>Pulse</span></div>
        <div class="nav-actions">
            <input type="text" id="searchInput" placeholder="Search...">
            <button id="themeToggle" title="Toggle Light/Dark Mode">🌓</button>
        </div>
    </nav>

    <main class="container">
        <section class="card">
            <div class="chart-header">
                <div class="selected-coin-info">
                    <img id="activeCoinLogo" src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png" alt="">
                    <h2 id="activeCoinName">Bitcoin</h2>
                </div>
                <div class="time-filters">
                    <button class="filter-btn active" data-days="1">24H</button>
                    <button class="filter-btn" data-days="7">7D</button>
                    <button class="filter-btn" data-days="30">30D</button>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </section>

        <div id="loading" class="spinner"></div>
        <div id="errorMessage" class="error-msg hidden">API limit reached. Please wait a minute and refresh.</div>
        
        <section class="crypto-grid" id="cryptoGrid">
            </section>
    </main>

    <script>
        const API_BASE = "https://api.coingecko.com/api/v3";
        let cryptoData = [];
        let myChart;
        let currentCoinId = 'bitcoin';

        const cryptoGrid = document.getElementById('cryptoGrid');
        const searchInput = document.getElementById('searchInput');
        const themeToggle = document.getElementById('themeToggle');
        const loading = document.getElementById('loading');

        // Fetch Markets
        async function fetchTopCoins() {
            try {
                loading.classList.remove('hidden');
                const response = await fetch(`${API_BASE}/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=12&page=1&sparkline=false`);
                if (!response.ok) throw new Error("API Error");
                
                cryptoData = await response.json();
                displayCoins(cryptoData);
                
                // Set initial chart
                const btc = cryptoData.find(c => c.id === 'bitcoin') || cryptoData[0];
                updateChart(btc.id, btc.name, btc.image);
            } catch (error) {
                document.getElementById('errorMessage').classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        function displayCoins(coins) {
            cryptoGrid.innerHTML = coins.map(coin => `
                <div class="coin-card" onclick="handleCoinClick('${coin.id}', '${coin.name}', '${coin.image}')">
                    <div class="coin-info">
                        <img src="${coin.image}" alt="${coin.name}" loading="lazy">
                        <div>
                            <h3>${coin.name}</h3>
                            <p style="color: var(--text-muted); font-size: 0.8rem;">${coin.symbol.toUpperCase()}</p>
                        </div>
                    </div>
                    <div class="price-details">
                        <p class="price">$${coin.current_price.toLocaleString()}</p>
                        <p class="change ${coin.price_change_percentage_24h >= 0 ? 'up' : 'down'}">
                            ${coin.price_change_percentage_24h > 0 ? '+' : ''}${coin.price_change_percentage_24h.toFixed(2)}%
                        </p>
                    </div>
                </div>
            `).join('');
        }

        // Search
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = cryptoData.filter(coin => 
                coin.name.toLowerCase().includes(term) || coin.symbol.toLowerCase().includes(term)
            );
            displayCoins(filtered);
        });

        // Chart Update
        async function updateChart(coinId, name, logo, days = 1) {
            currentCoinId = coinId;
            document.getElementById('activeCoinName').innerText = name;
            document.getElementById('activeCoinLogo').src = logo;

            try {
                const response = await fetch(`${API_BASE}/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`);
                const data = await response.json();
                
                const labels = data.prices.map(p => {
                    const date = new Date(p[0]);
                    return days === 1 ? date.toLocaleTimeString([], { hour: '2-digit' }) : date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                });
                const prices = data.prices.map(p => p[1]);

                if (myChart) myChart.destroy();

                const ctx = document.getElementById('priceChart').getContext('2d');
                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: prices,
                            borderColor: '#38bdf8',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.4,
                            fill: true,
                            backgroundColor: (context) => {
                                const bg = context.chart.ctx.createLinearGradient(0, 0, 0, 400);
                                bg.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
                                bg.addColorStop(1, 'rgba(56, 189, 248, 0)');
                                return bg;
                            }
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { display: true, ticks: { maxTicksLimit: 6, color: '#94a3b8' }, grid: { display: false } },
                            y: { display: true, ticks: { color: '#94a3b8' }, grid: { color: 'rgba(148, 163, 184, 0.1)' } }
                        }
                    }
                });
            } catch (err) { console.error("Chart error:", err); }
        }

        function handleCoinClick(id, name, logo) {
            updateChart(id, name, logo, document.querySelector('.filter-btn.active').dataset.days);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Time Filters
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelector('.filter-btn.active').classList.remove('active');
                this.classList.add('active');
                const name = document.getElementById('activeCoinName').innerText;
                const logo = document.getElementById('activeCoinLogo').src;
                updateChart(currentCoinId, name, logo, this.dataset.days);
            });
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('crypto-theme', newTheme);
        });

        // Init
        const savedTheme = localStorage.getItem('crypto-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        fetchTopCoins();
    </script>
</body>
</html>
